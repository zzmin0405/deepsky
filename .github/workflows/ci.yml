name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # API 키는 실행 시점에 읽고 테스트는 외부 API를 흉내 내므로 CI에는 비밀값이 필요 없습니다.
      - name: Svelte and type checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
